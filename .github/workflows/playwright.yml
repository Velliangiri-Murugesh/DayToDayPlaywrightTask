name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Create saved login session
      run: npx playwright test day17-auth-setup --project=chromium
    - name: Run Playwright tests
      run: npx playwright test --project=chromium --grep-invert "@negative|@visual|@needs-session"
    - name: Run session test
      run: npx playwright test day17-auth-reuse --project=chromium
    - uses: actions/upload-artifact@v4.6.2
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
