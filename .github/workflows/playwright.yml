name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env from secrets
        run: |
          {
            echo "BASE_URL=${{ secrets.BASE_URL }}"
            echo "STAGING_URL=${{ secrets.BASE_URL }}"
            echo "PROD_URL=${{ secrets.BASE_URL }}"
            echo "TEST_USERNAME=${{ secrets.TEST_USERNAME }}"
            echo "TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}"
          } > .env

      - name: Check environment
        run: node scripts/check-env.js

      - name: Smoke tests
        run: npx playwright test --project=chromium --grep "@smoke"

      - name: Regression and UI tests
        run: npx playwright test --project=chromium --grep "@regression|@ui" --grep-invert "@negative|@needs-session"

      - name: API tests
        run: npx playwright test tests/api --project=chromium

      - name: Accessibility tests
        run: npx playwright test tests/a11y --project=chromium
        
      - name: Create saved login session
        run: npx playwright test day17-auth-setup --project=chromium

      - name: Session reuse test
        run: npx playwright test day17-auth-reuse --project=chromium

      - name: Upload Allure results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30